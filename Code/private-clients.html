<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Clients & Non-Profits — Mairhofer Advokatur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e1014;
      --text: #e8e6e1;
      --text-muted: #6b7280;
      --accent: #2a9fd6;
      --border: rgba(255,255,255,0.08);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    /* Nav */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 48px; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(14,16,20,0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo-img { height: 60px; width: auto; display: block; }
    .nav-back {
      font-family: var(--font-sans); font-size: 13px;
      color: var(--text-muted); letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }

    /* Page hero */
    .page-hero {
      padding: 160px 48px 100px;
      max-width: 1180px; margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .page-hero h1 {
      font-family: var(--font-serif); font-size: clamp(36px, 5vw, 64px);
      font-weight: 300; line-height: 1.15; color: var(--text);
    }

    /* Placeholder body */
    .page-body {
      max-width: 1180px; margin: 0 auto;
      padding: 100px 48px;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder {
      text-align: center; color: var(--text-muted);
      font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="index.html" class="nav-logo">
      <img src="../assets/images/logo/MAIRHOFER ADVOKATUR.png" alt="Mairhofer Advokatur" class="nav-logo-img" />
    </a>
    <a href="index.html" class="nav-back">← Zurück zur Startseite</a>
  </nav>

  <main>
    
    <div class="page-hero">
      <h1>Private Clients &amp; Non-Profits</h1>
    </div>
    <div class="page-body">
      <p class="placeholder">Inhalt folgt in Kürze</p>
    </div>
  </main>

</body>
</html>
